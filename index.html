button.ch .L{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--card);font-weight:700}
button.ch.ok{background:var(--good);border-color:var(--good);color:var(--card)}button.ch.no{background:var(--bad);border-color:var(--bad);color:var(--card)}

function setup(){
 app.innerHTML='<h1>Race to the Promised Land</h1><p class="mute">Antebellum reform and expansion review, Chapters 11 and 12. This game never ends. Answer questions to earn cotton: Every question is multiple choice: pick A, B, C or D. Easy = 1 cotton, Medium = 2, Hard = 3. Land on a green Double Points space and you get a bonus question right away: pick Easy, Medium or Hard, and a correct answer earns double cotton (2, 4 or 6). Correct answers also move your token around the loop, and special spaces help or hurt whichever team lands on them, the same for everyone. Press End game when time is up.</p><div class="card"><h2>Teams</h2>'+

}

 G={t:names.map(function(n){return{n:n,p:0,c:0,skip:0,r:0,k:0}}),cur:0,ph:"pick",i:[0,0,0],q:null,note:"",msg:"",sec:false};draw();
}

  var dbl=ev&&ev.c=="D",bad=ev&&"SBL".indexOf(ev.c)>=0;h+='<div class="c'+(dbl?' dbl':bad?' ev bad':ev?' ev':'')+'"><i>'+(i==0?"Start":i)+'</i><span>'+(ev?esc(ev.t):"")+'</span>'+(ev?'<div class="tn"><u>'+tiny(ev)+'</u></div>':'')+'<div class="tk">'+tk+'</div></div>';}
 return h+'</div>';
}
function teamsHTML(){
 return '<div class="teams">'+G.t.map(function(t,j){return '<div class="team'+(j==G.cur?' on':'')+'" style="--tc:var(--t'+j+')"><b>'+esc(t.n)+'</b><div class="cr">Cotton: <b>'+t.c+'</b></div><small>'+[t.skip?'Loses next turn':'',t.r?'Second chance ready':''].filter(Boolean).join(' · ')+'</small></div>'}).join('')+'</div>';

function draw(){
 var t=G.t[G.cur],top='<div class="row" style="margin:0"><button class="alt" data-a="end" style="min-height:36px;padding:6px 12px">End game</button><button class="alt" data-a="reset" style="min-height:36px;padding:6px 12px">Restart</button></div>',p="";

  p='<div class="card">'+(G.note?'<p class="bad">'+esc(G.note)+'</p>':'')+'<h2>'+esc(t.n)+', your turn</h2><p>The whole team answers together. Pick your difficulty.</p><div class="row"><button data-a="tier" data-v="1">Easy: 1 cotton</button><button data-a="tier" data-v="2">Medium: 2 cotton</button><button data-a="tier" data-v="3">Hard: 3 cotton</button></div></div>';
 }else if(G.ph=="bpick"){
  p='<div class="card"><span class="tag">Double points bonus</span><h2 style="margin-top:8px">'+esc(t.n)+', bonus question!</h2><p>Pick a difficulty. Get it right for double cotton. A bonus question does not move your token.</p><div class="row"><button data-a="btier" data-v="1">Easy: 2 cotton</button><button data-a="btier" data-v="2">Medium: 4 cotton</button><button data-a="btier" data-v="3">Hard: 6 cotton</button></div></div>';
 }else if(G.ph=="q"){
  p='<div class="card">'+(G.note2?'<p class="bad">'+esc(G.note2)+'</p>':'')+'<span class="tag">'+["Easy","Medium","Hard"][G.q[0]-1]+' · Question #'+(G.qi+1)+(G.sec?' · Second chance':'')+(G.isBonus?' · Bonus: double cotton':'')+'</span><p class="big" style="margin-top:10px">'+esc(G.q[1])+'</p>'+choicesHTML(-1)+'</div>';
 }else if(G.ph=="res"){

 }

function result(ok){

 if(G.isBonus){G.isBonus=false;

  G.msg=m;G.ph="res";draw();return}

  if(t.r){t.r=0;G.wrong=G.pick;G.sec=true;G.note2="Incorrect! Second chance: try again.";draw();return}

 }else{

   else if(c=="T"){m+='<p class="good">Steal a student! Pick one student from any other team to join '+esc(t.n)+'. Move them now.</p>'}
   else if(c=="D"){G.bonusNext=1;m+='<p class="good">Bonus question! Answer one more question for double cotton.</p>'}
   else if(c=="G"){t.c+=n2;m+='<p class="good">Gain '+n2+' cotton.</p>'}
   else if(c=="L"){var k2=Math.min(n2,t.c);t.c-=k2;m+='<p class="bad">Lose '+k2+' cotton.</p>'}
}
 }
 G.msg=m;G.ph="res";draw();
}
function next(){
 var s="";do{G.cur=(G.cur+1)%3;var t=G.t[G.cur];if(t.skip){t.skip=0;s+=t.n+" skip this turn. ";continue}break}while(true);
 G.note=s;G.note2="";G.wrong=-1;G.ph="pick";draw();
}
app.addEventListener("click",function(e){
 var b=e.target.closest("button");if(!b)return;var a=b.dataset.a;

 else if(a=="bonus"){G.bonusNext=0;G.ph="bpick";draw()}

});
